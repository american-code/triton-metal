[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-metal"
version = "0.0.1"
description = "Thin Triton plugin shim over the Swift TritonMetalCore (libtritonmetal.dylib)"
readme = "../README.md"
license = { file = "../LICENSE" }
requires-python = ">=3.10"
# Triton intentionally not pinned yet — see docs/ARCHITECTURE.md §Compatibility.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["triton_metal*"]
