name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# A queued run of an obsolete commit is not worth a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: swift build + swift test + pytest (macOS arm64)
    runs-on: macos-latest
    # 45 was comfortable before the MLX frontend; `swift build` now also compiles
    # mlx-swift's bundled MLX C++ core (179 translation units, ~70s on an M1 Pro
    # with 10 cores, longer on a 3-vCPU runner) and clones a large checkout to do
    # it. 60 leaves the same headroom the old number had.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain and machine
        run: |
          set -o pipefail
          sw_vers
          uname -m
          swift --version
          python3 --version

      # Whether the runner's GPU can run what this backend emits is a *result*,
      # not an assumption. GitHub's macOS runners are virtualised and report an
      # "Apple Paravirtual device": Metal answers every query, and a dispatch may
      # still fail or come back empty. `MetalRuntime.unusableReason` probes it by
      # compiling and running a kernel that uses both halves of what an emitted
      # kernel needs — a device store and a simdgroup multiply-accumulate — and
      # every GPU test in both suites skips on what it reports. This step only
      # records the verdict in the log so a run's skips are explainable.
      - name: Probe the Metal device
        run: |
          set -o pipefail
          swift build --product tmbench 2>&1 | tail -1
          .build/debug/tmbench --probe

      - name: swift build
        run: |
          set -o pipefail
          swift build 2>&1 | tail -20

      # The MLX frontend's IR is generated in Swift, and `tmsae --emit-ir` prints
      # it without touching MLX or the GPU — so it is the one part of that target
      # a runner with no usable device can still exercise end to end.
      - name: Lower the SAE kernel
        run: |
          set -o pipefail
          swift build --product tmsae 2>&1 | tail -1
          .build/debug/tmsae --emit-ir | head -3

      # `mlx.metallib` is deliberately NOT fetched here. TritonMetalMLXTests gate
      # on two things — a device that can run an emitted kernel, and MLX's shader
      # library — and this runner fails the first one anyway, so installing the
      # second would change nothing but the download. The bundle's 35 cases skip
      # cleanly; `-rs` prints why. On a real Mac they run: see
      # docs/USAGE.md §The Swift-native path.
      - name: swift test
        run: |
          set -o pipefail
          swift test 2>&1 | tail -60

      # The Python package is a ctypes shim over the dylib `swift build` just
      # produced; it has no dependency beyond pytest. The Triton round-trip
      # suite skips itself when `import triton` fails, which it does here —
      # Triton publishes no macOS wheel and building it from source is ~9
      # minutes (docs/USAGE.md).
      # A venv because the runner's python3 is Homebrew's, which is
      # externally managed (PEP 668) and refuses a bare `pip install`.
      - name: pytest (Python shim)
        working-directory: python
        run: |
          set -o pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --disable-pip-version-check pytest
          PYTHONPATH=. .venv/bin/python -m pytest tests/ -q -rs 2>&1 | tail -40
